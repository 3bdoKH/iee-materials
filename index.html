<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impossible Rock Paper Scissors</title>
    <style>
        /* CSS Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .game-container {
            background-color: #34495e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 300px;
        }

        .choices {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        button {
            background-color: #e74c3c;
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: scale(1.1);
            background-color: #c0392b;
        }

        button:active {
            transform: scale(0.95);
        }

        .result-area {
            margin-top: 20px;
            min-height: 100px;
        }

        #outcome {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
            /* Red color for losing */
            margin: 10px 0;
        }

        .moves {
            font-size: 1rem;
            color: #bdc3c7;
        }
    </style>
</head>

<body>

    <div class="game-container">
        <h1>Try to Win</h1>
        <p>Choose your weapon:</p>

        <div class="choices">
            <button onclick="playGame('rock')" title="Rock">🪨</button>
            <button onclick="playGame('paper')" title="Paper">📄</button>
            <button onclick="playGame('scissors')" title="Scissors">✂️</button>
        </div>

        <div class="result-area">
            <div id="moves" class="moves"></div>
            <div id="outcome"></div>
        </div>
    </div>

    <script>
        // JS Logic
        function playGame(userChoice) {
            const movesDisplay = document.getElementById('moves');
            const outcomeDisplay = document.getElementById('outcome');

            let computerChoice;

            // THE TRICK: The computer doesn't pick randomly.
            // It waits to see what you picked, then picks the counter.
            if (userChoice === 'rock') {
                computerChoice = 'paper';
            } else if (userChoice === 'paper') {
                computerChoice = 'scissors';
            } else {
                computerChoice = 'rock';
            }

            // Convert text to emoji for display
            const emojiMap = {
                'rock': '🪨',
                'paper': '📄',
                'scissors': '✂️'
            };

            // Display the moves
            movesDisplay.innerHTML = `
                You: ${emojiMap[userChoice]} <br> 
                Computer: ${emojiMap[computerChoice]}
            `;

            // Display the result
            outcomeDisplay.innerText = "Computer Wins!";
            outcomeDisplay.style.color = "#e74c3c"; // Ensure red text
        }
    </script>
</body>

</html>
